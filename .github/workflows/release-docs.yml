name: Release Topoo Docs

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - preview
          - production
      system_ref:
        description: Immutable topoodoc commit, tag, or reviewed branch
        required: true
        default: main
      content_ref:
        description: Immutable topoo-docs commit, tag, or reviewed branch
        required: true
        default: main
      requested_by:
        description: Human or Agent requesting the release
        required: true
        default: topoo

permissions:
  contents: read
  deployments: write

concurrency:
  group: topoo-docs-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  integrate:
    name: integrate-pinned-revisions
    runs-on: ubuntu-latest
    outputs:
      system_sha: ${{ steps.revisions.outputs.system_sha }}
      content_sha: ${{ steps.revisions.outputs.content_sha }}

    steps:
      - name: Checkout pinned system revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.system_ref }}
          fetch-depth: 0
          path: system

      - name: Checkout pinned content revision
        uses: actions/checkout@v4
        with:
          repository: topooAI/topoo-docs
          ref: ${{ inputs.content_ref }}
          fetch-depth: 0
          path: content

      - name: Record integrated revisions
        id: revisions
        run: |
          echo "system_sha=$(git -C system rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "content_sha=$(git -C content rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: system/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: system
        run: pnpm install --frozen-lockfile

      - name: Build one integrated artifact
        working-directory: system
        env:
          TOPOODOC_CONTENT_REPO: ${{ github.workspace }}/content
        run: pnpm content:build

      - name: Upload integrated artifact
        uses: actions/upload-artifact@v4
        with:
          name: topoo-docs-${{ github.run_id }}
          path: system/apps/content-site/out
          if-no-files-found: error
          retention-days: 14

  preview:
    if: inputs.channel == 'preview'
    needs: integrate
    runs-on: ubuntu-latest
    environment: preview

    steps:
      - name: Checkout pinned system revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.system_sha }}
          path: system

      - name: Download integrated artifact
        uses: actions/download-artifact@v4
        with:
          name: topoo-docs-${{ github.run_id }}
          path: system/apps/content-site/out

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        working-directory: system
        run: pnpm install --frozen-lockfile

      - name: Deploy preview artifact
        working-directory: system/apps/content-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.preview.jsonc

  production:
    if: inputs.channel == 'production'
    needs: integrate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout pinned system revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.system_sha }}
          path: system

      - name: Download integrated artifact
        uses: actions/download-artifact@v4
        with:
          name: topoo-docs-${{ github.run_id }}
          path: system/apps/content-site/out

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        working-directory: system
        run: pnpm install --frozen-lockfile

      - name: Deploy production artifact
        working-directory: system/apps/content-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.jsonc

      - name: Write release summary
        run: |
          {
            echo "## Topoo Docs production release"
            echo ""
            echo "- Requested by: ${{ inputs.requested_by }}"
            echo "- System revision: ${{ needs.integrate.outputs.system_sha }}"
            echo "- Content revision: ${{ needs.integrate.outputs.content_sha }}"
            echo "- Artifact: topoo-docs-${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
